org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The app's version, and the only place it is set. Bump both in the PR that precedes a
# release: the release workflow tags v<VERSION_NAME> from them, and F-Droid's
# checkupdates reads them at each tag to update its build recipe on its own.
# VERSION_CODE = major * 1_000_000 + minor * 1_000 + patch + 1, so codes keep rising.
VERSION_NAME=0.1.0
VERSION_CODE=1001
